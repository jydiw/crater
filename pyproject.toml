[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crater"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "mutagen>=1.47",
    "pyacoustid>=1.3",
    "musicbrainzngs>=0.7",
]

[project.scripts]
crater = "crater.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "soundfile>=0.12",
    "numpy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
